              batch.set(doc(db, 'project', 'aristo_plot_main'), INITIAL_PLOT_PROJECT);
              INITIAL_MEMBERS.forEach(m => batch.set(doc(db, 'members', m.id), m));
              INITIAL_TRANSACTIONS.forEach(t => batch.set(doc(db, 'transactions', t.id), t));
              batch.commit().then(() => {
                setIsCloudSynced(true);
                showToast("Connected to live Firestore. Data seeded.");
              });
            } else {
              setIsCloudSynced(true);
            }
          }).catch(err => console.log('Firestore connect:', err));

          // Real-time live listeners
          const unsubMembers = onSnapshot(collection(db, 'members'), (snapshot) => {
            if (!snapshot.empty) {
              const list = [];
              snapshot.forEach(d => list.push(d.data()));
              list.sort((a, b) => parseInt(a.id.replace(/\D/g, '') || 0) - parseInt(b.id.replace(/\D/g, '') || 0));
              setMembers(list);
              setIsCloudSynced(true);
            }
          });

          const unsubTxs = onSnapshot(collection(db, 'transactions'), (snapshot) => {
            const list = [];
            snapshot.forEach(d => list.push(d.data()));
            list.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());
            setTransactions(list);
            setIsCloudSynced(true);
          });

          const unsubProject = onSnapshot(doc(db, 'project', 'aristo_plot_main'), (docSnap) => {
            if (docSnap.exists()) {
              setProject(docSnap.data());
              setIsCloudSynced(true);
            }
          });

          return () => {
            unsubMembers();
            unsubTxs();
            unsubProject();
          };
        };

        if (window.__FIREBASE__) {
          setupFirebase();
        } else {
          window.addEventListener('firebase-initialized', setupFirebase);
          return () => window.removeEventListener('firebase-initialized', setupFirebase);
        }
      }, []);

      // Check URL for shareable link (?form=deposit)
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('form') === 'deposit' || params.has('deposit')) {
            setIsGoogleFormModalOpen(true);
            const mId = params.get('member');
            if (mId) setPreselectedFormMemberId(mId);
          }
        } catch(e) {}
      }, []);

      // Cloud Write Helpers
      const syncTxToCloud = (tx) => {
        if (window.__FIREBASE__) {
          const { db, doc, setDoc } = window.__FIREBASE__;
          setDoc(doc(db, 'transactions', tx.id), tx, { merge: true }).catch(console.error);
        }
      };

      const deleteTxFromCloud = (txId) => {
        if (window.__FIREBASE__) {
          const { db, doc, deleteDoc } = window.__FIREBASE__;
          deleteDoc(doc(db, 'transactions', txId)).catch(console.error);
        }
      };

      const syncMemberToCloud = (member) => {
        if (window.__FIREBASE__) {
          const { db, doc, setDoc } = window.__FIREBASE__;
          setDoc(doc(db, 'members', member.id), member, { merge: true }).catch(console.error);
        }
      };

      const syncProjectToCloud = (proj) => {
        if (window.__FIREBASE__) {
          const { db, doc, setDoc } = window.__FIREBASE__;
          setDoc(doc(db, 'project', 'aristo_plot_main'), proj, { merge: true }).catch(console.error);
        }
      };

      // Financials
      const grossTotal = useMemo(() => transactions.reduce((sum, t) => sum + (Number(t.amount) || 0), 0), [transactions]);
      const netTotal = useMemo(() => Math.max(0, grossTotal - (project.totalCombinedBankCharge || 0)), [grossTotal, project.totalCombinedBankCharge]);

      // Shareable Link Builder

      // --- RENDER 1: GATEKEEPER / LOGIN APPROVAL SCREEN ---
      if (!session.isLoggedIn) {
        return (

        </div>

        }

          amount: numAmount,
          deductionOrFee: 0,

          method,

                          {member.role === 'admin' ? (
                            <span className="text-[9px] bg-emerald-950 text-emerald-400 font-bold px-1.5 py-0.5 rounded border border-emerald-800">ADMIN</span>
                          ) : isSelf ? (
                            <span className="text-[9px] bg-emerald-950 text-emerald-400 font-bold px-1.5 py-0.5 rounded border border-emerald-800">YOU</span>
                          ) : null}
                        </div>
                        <span className="text-xs text-slate-400 block">{member.mobile}</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 text-xs font-mono">
                      <div>
                        <span className="text-[10px] text-slate-500 block font-sans">TOTAL DEPOSITED</span>
                        <span className="font-bold text-emerald-400">{formatCurrency(gross)}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-500 block font-sans">CYCLES CLEARED</span>
                        <span className="font-bold text-white">{memTxs.length} / 8</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 mt-3 border-t border-slate-800 flex justify-between items-center text-xs">
                    <span className="text-slate-400">{member.nomineeName ? `Nominee: ${member.nomineeName}` : 'Regular Member'}</span>
                    {canEdit && (
                      <button 
                        onClick={() => setEditingMember(member)}
                        className="text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1 cursor-pointer"
                      >
                        <IconEdit className="w-3.5 h-3.5" />
                        <span>Edit Profile</span>
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {editingMember && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-sm animate-fadeIn">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 text-xs space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-sm">Edit Profile: {editingMember.name}</h3>
                  <button onClick={() => setEditingMember(null)} className="p-1 rounded-lg hover:bg-slate-800 cursor-pointer">
                    <IconX className="w-4 h-4 text-slate-400" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  onUpdateProfile(editingMember);
                  setEditingMember(null);
                }} className="space-y-3 text-left">
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Full Name</label>
                    <input 
                      type="text" 
                      value={editingMember.name}
                      onChange={(e) => setEditingMember({ ...editingMember, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Email Address</label>
                    <input 
                      type="email" 
                      value={editingMember.email}
                      onChange={(e) => setEditingMember({ ...editingMember, email: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Mobile Contact</label>
                    <input 
                      type="text" 
                      value={editingMember.mobile}
                      onChange={(e) => setEditingMember({ ...editingMember, mobile: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] text-slate-400 block mb-1">Nominee Name</label>
                    <input 
                      type="text" 
                      value={editingMember.nomineeName || ''}
                      onChange={(e) => setEditingMember({ ...editingMember, nomineeName: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-emerald-500"
                    />
                  </div>
                  <button type="submit" className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-colors cursor-pointer">
                    Save Profile to Live Cloud
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render into Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
